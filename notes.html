<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>깨비 노트 · 깨비AI</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#1e293b;font:16px/1.8 -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}main{max-width:820px;margin:auto;padding:40px 22px 80px}a{color:#2563eb}h1{font-size:clamp(30px,6vw,42px);letter-spacing:-1.5px;line-height:1.3}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.btn{display:inline-block;border:0;background:#2563eb;color:white;text-decoration:none;padding:12px 20px;border-radius:12px;font-weight:700}article,.panel,details{padding:26px;background:white;border:1px solid #e2e8f0;border-radius:16px;margin:20px 0}summary{cursor:pointer;font-size:21px;font-weight:700}small,.muted{color:#64748b}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:20px 0}li{margin:12px 0}h2{font-size:23px}</style></head><body><main><header><a href="/">← 깨비AI 홈</a><a href="/write.html">운영자 글쓰기 ↗</a></header><h1>알고 나면, 바로 써보고 싶은 AI</h1><p class="muted">깨비AI의 활용법과 실전 기록을 모았어요.</p><div id="posts"></div><p id="status" aria-live="polite">새 글을 불러오는 중…</p><article><small>시작 가이드 · 2026.10.04</small><h2>최저가 비교·KTX 시간표, AI에게 맡기려면?</h2><p>공개 프로젝트 k-skill의 한국 서비스용 기능을 소개해요. 필요한 실행 환경부터 혼잡도 조회, 가격 비교, 계획 시간표 질문까지 단계별로 정리했어요.</p><a class="btn" href="/korean-ai.html">가이드 읽고 PDF 받기 →</a></article></main><script>
(async()=>{const target=document.getElementById('posts'), status=document.getElementById('status');try{const response=await fetch('https://api.github.com/repos/lynnhong0033-glitch/kkaebi/issues?creator=lynnhong0033-glitch&state=open&sort=created&direction=desc&per_page=100',{signal:AbortSignal.timeout(10000)});if(!response.ok)throw Error('unavailable');const items=await response.json();const posts=items.filter(p=>!p.pull_request&&p.user.login==='lynnhong0033-glitch'&&p.title.startsWith('[글]'));for(const p of posts){const detail=document.createElement('details'),title=document.createElement('summary'),date=document.createElement('small'),body=document.createElement('div'),link=document.createElement('a');title.textContent=p.title.slice(3).trim()||'깨비 노트';date.textContent=new Date(p.created_at).toLocaleDateString('ko-KR');body.className='body';body.textContent=p.body||'';link.textContent='원문 보기 ↗';link.href='https://github.com/lynnhong0033-glitch/kkaebi/issues/'+Number(p.number);link.target='_blank';link.rel='noopener noreferrer';detail.append(title,date,body,link);target.append(detail)}status.textContent=posts.length?'':'새로운 노트도 곧 이곳에서 만나요.'}catch(e){status.textContent='새 글을 불러오지 못했어요. 잠시 후 새로고침해 주세요. 아래 가이드는 바로 읽을 수 있어요.'}})();
</script></body></html>
